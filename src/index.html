<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartNotes">
  <meta name="theme-color" content="#059669">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=4">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=4">
  <link rel="alternate icon" type="image/png" href="icon-192.png?v=4">
  <link rel="apple-touch-icon" href="icon-192.png?v=4">
  <link rel="manifest" href="manifest.json?v=4">
  <title>SmartNotes - Gestor Inteligente con Google Drive</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="app-layout">
    <!-- PANEL LATERAL (SIDEBAR) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="logo-icon">
            <svg width="38" height="38" viewBox="0 0 512 512" style="display: block; border-radius: 9px;">
              <defs>
                <linearGradient id="snLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#064e3b"/>
                  <stop offset="45%" stop-color="#059669"/>
                  <stop offset="75%" stop-color="#10b981"/>
                  <stop offset="100%" stop-color="#34d399"/>
                </linearGradient>
                <linearGradient id="snLogoSheet" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
                </linearGradient>
              </defs>
              <rect width="512" height="512" rx="118" fill="url(#snLogoBg)"/>
              <path d="M148 112 H316 L376 172 V392 C376 406 364 418 350 418 H148 C134 418 122 406 122 392 V138 C122 124 134 112 148 112 Z" fill="url(#snLogoSheet)" stroke="rgba(255,255,255,0.45)" stroke-width="14" stroke-linejoin="round"/>
              <path d="M316 112 V166 C316 170 320 174 324 174 H376" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M178 280 L242 344 L356 196" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M400 88 C400 106 410 116 428 116 C410 116 400 126 400 144 C400 126 390 116 372 116 C390 116 400 106 400 88 Z" fill="#6ee7b7"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>SmartNotes</h1>
          </div>
        </div>
        <button class="mobile-close-btn" id="mobileCloseSidebarBtn">✕</button>
      </div>

      <!-- Acción Principal: Nueva Nota -->
      <div class="sidebar-action">
        <button id="toggleFormBtn" class="btn-new-note" title="Crear nueva nota">
          <svg class="plus-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span id="toggleFormBtnText">Nueva Nota</span>
        </button>
      </div>

      <!-- Vistas por Estado / Métricas -->
      <div class="sidebar-section">
        <span class="sidebar-section-title">Vistas de Tareas</span>
        <div class="nav-list">
          <button class="nav-item active" data-status-filter="all">
            <span class="nav-label-wrap">
              <span>📋</span> Todas
            </span>
            <span class="nav-badge" id="totalNotes">0</span>
          </button>
          <button class="nav-item" data-status-filter="pending">
            <span class="nav-label-wrap">
              <span>⏳</span> Pendientes
            </span>
            <span class="nav-badge" id="pendingNotes">0</span>
          </button>
          <button class="nav-item" data-status-filter="completed">
            <span class="nav-label-wrap">
              <span>✅</span> Completadas
            </span>
            <span class="nav-badge" id="completedNotes">0</span>
          </button>
          <button class="nav-item" data-status-filter="overdue">
            <span class="nav-label-wrap">
              <span>⚠️</span> Vencidas
            </span>
            <span class="nav-badge alert" id="overdueNotes">0</span>
          </button>
        </div>
      </div>

      <!-- Categorías de Notas -->
      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <span class="sidebar-section-title">Categorías</span>
          <button id="openCategoryModalBtn" class="btn-add-cat" title="Gestionar categorías">⚙️ Ajustes</button>
        </div>
        <div class="category-nav-list" id="sidebarCategoryList">
          <!-- Se puebla dinámicamente -->
        </div>
      </div>

      <!-- Nube Google Drive (Sincronización PC y Móvil Privada) -->
      <div class="sidebar-section">
        <span class="sidebar-section-title">Nube Google Drive</span>
        <div class="sync-card" id="googleDriveCard">
          <div class="sync-status-row">
            <span class="sync-indicator">
              <span class="sync-dot" id="syncDot"></span>
              <span id="syncStatusText">Desconectado</span>
            </span>
            <button class="btn-sync-disconnect" id="disconnectDriveBtn" style="display: none;" title="Cerrar sesión de Google">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Salir</span>
            </button>
          </div>
          <div class="sync-filename" id="syncFolderText">Inicia sesión con tu cuenta</div>
          <button id="connectDriveBtn" class="sync-btn gdrive-btn" title="Iniciar sesión con Google para sincronizar tus notas">
            <svg width="15" height="15" viewBox="0 0 24 24" style="flex-shrink: 0;">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span id="connectDriveBtnLabel">Conectar con Google</span>
          </button>
        </div>
      </div>

      <!-- Instalación como App PWA en Móvil / Escritorio -->
      <div class="sidebar-section" id="pwaInstallSection" style="display: none;">
        <button id="pwaInstallBtn" class="sync-btn pwa-btn" title="Instalar SmartNotes como aplicación en tu dispositivo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span id="pwaInstallBtnText">Instalar App en el Móvil</span>
        </button>
      </div>
    </aside>

    <!-- Backdrop móvil -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ÁREA PRINCIPAL FULL-WIDTH -->
    <main class="main-content">
      <!-- Barra Superior (Búsqueda + Ordenación + Menú móvil) -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" title="Abrir barra lateral">☰</button>
          <div class="search-box">
            <span class="search-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Buscar notas por título, contenido o detalles..." 
              autocomplete="off"
            />
          </div>
        </div>

        <div class="topbar-right">
          <div class="text-size-box">
            <label for="textSizeSelect">Texto:</label>
            <select id="textSizeSelect" title="Ajustar tamaño de la tipografía">
              <option value="1">Normal (100%)</option>
              <option value="1.12">Grande (+12%)</option>
              <option value="1.25">Muy Grande (+25%)</option>
            </select>
          </div>
          <div class="sort-box">
            <label for="sortSelect">Ordenar por:</label>
            <select id="sortSelect">
              <option value="newest">Más recientes</option>
              <option value="oldest">Más antiguas</option>
              <option value="az">Alfabético (A-Z)</option>
              <option value="due_date">Fecha Límite</option>
              <option value="urgency">Urgencia</option>
            </select>
          </div>
          <button id="themeToggleBtn" class="theme-toggle-btn" title="Cambiar a Modo Claro" aria-label="Cambiar tema">
            <span id="themeIcon">🌙</span>
          </button>
        </div>
      </header>

      <!-- Formulario Plegable para Añadir Nota -->
      <section class="collapsible-section" id="newNoteSection">
        <div class="card">
          <div class="form-header-bar">
            <h2 class="form-title">➕ Crear Nueva Nota o Tarea</h2>
            <button type="button" class="btn" id="closeFormBtn" title="Cerrar formulario">
              <span>✕ Cerrar</span>
            </button>
          </div>
          <form id="newNoteForm">
            <div class="input-row">
              <input 
                type="text" 
                id="noteTitle" 
                class="flex-1" 
                placeholder="¿Qué necesitas hacer o recordar? (Obligatorio)" 
                required 
                autocomplete="off"
              />
              <select id="noteCategory">
                <!-- Se puebla dinámicamente -->
              </select>
              <input 
                type="date" 
                id="noteDueDate" 
                title="Fecha límite (opcional)"
              />
            </div>
            <textarea 
              id="noteContent" 
              placeholder="Detalles adicionales, enlaces o descripción..."
            ></textarea>
            <div>
              <button type="submit" class="btn">Guardar Nota</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Barra de Filtro Activo, Conmutador de Vista y Conteo -->
      <div class="filter-status-bar">
        <div class="current-filter-pill">
          <span id="currentFilterTitle">Todas las notas</span>
          <span class="filter-count-badge" id="currentFilterCount">(3 notas)</span>
        </div>
        <div class="filter-bar-actions">
          <button id="viewToggleBtn" class="view-toggle-btn" title="Cambiar a vista de lista (una tarea por línea)">
            <svg id="viewIconList" class="view-btn-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <svg id="viewIconGrid" class="view-btn-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
            </svg>
            <span id="viewToggleLabel">Vista Lista</span>
          </button>
          <button id="resetCardSizeBtn" class="reset-size-btn" style="display: none;" title="Restablecer tamaño predeterminado de las tarjetas">
            <span>↺</span> Restablecer tamaño
          </button>
        </div>
      </div>

      <!-- Rejilla Fluida que aprovecha toda la pantalla -->
      <div class="full-width-grid" id="notesGrid">
        <!-- Se puebla dinámicamente con app.js -->
      </div>
    </main>
  </div>

  <!-- Modal de Detalle de Nota (Lectura Completa) -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="detailTitle" style="font-size: 1.2rem; word-break: break-word;">Detalle de Nota</h3>
        <button class="btn-action" id="closeDetailModalBtn">✕</button>
      </div>
      <div class="detail-meta-row" id="detailMetaRow">
        <!-- Badges de categoría, fecha límite y estado -->
      </div>
      <div class="detail-content-box" id="detailContent">
        <!-- Texto completo -->
      </div>
      <div class="modal-footer" style="justify-content: space-between;">
        <span id="detailCreatedAt" style="font-size: 0.78rem; color: var(--text-muted); align-self: center;"></span>
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" class="btn-secondary" id="editFromDetailBtn">✏️ Editar</button>
          <button type="button" class="btn" id="closeDetailBtn">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Nota -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>✏️ Editar Nota</h3>
        <button class="btn-action" id="closeEditModalBtn">✕</button>
      </div>
      <form id="editNoteForm">
        <input type="hidden" id="editNoteId">
        <div>
          <label>Título:</label>
          <input type="text" id="editNoteTitle" style="width: 100%;" required>
        </div>
        <div class="input-row">
          <div style="flex: 1;">
            <label>Categoría:</label>
            <select id="editNoteCategory" style="width: 100%;"></select>
          </div>
          <div style="flex: 1;">
            <label>Fecha Límite:</label>
            <input type="date" id="editNoteDueDate" style="width: 100%;">
          </div>
        </div>
        <div>
          <label>Contenido:</label>
          <textarea id="editNoteContent" style="width: 100%;"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelEditBtn">Cancelar</button>
          <button type="submit" class="btn">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para Gestión y Eliminación de Categorías -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🏷️ Gestionar Categorías</h3>
        <button class="btn-action" id="closeCategoryModalBtn">✕</button>
      </div>

      <!-- Lista de Categorías Existentes con Borrado -->
      <div>
        <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; display: block;">
          Categorías existentes:
        </label>
        <div class="category-list-container" id="categoryListContainer">
          <!-- Se puebla dinámicamente -->
        </div>
      </div>

      <!-- Formulario para Añadir Nueva Categoría -->
      <form id="newCategoryForm">
        <h4 style="font-size: 0.95rem; font-weight: 600; margin-bottom: 0.4rem;">➕ Añadir Nueva Categoría</h4>
        <div>
          <label>Nombre:</label>
          <input type="text" id="newCategoryName" placeholder="Ej: Gimnasio, Finanzas, Estudio..." required style="width: 100%;">
        </div>
        <div>
          <label>Color distintivo:</label>
          <input type="color" id="newCategoryColor" value="#38bdf8" style="height: 38px; width: 100%; cursor: pointer;">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelCategoryBtn">Cerrar</button>
          <button type="submit" class="btn">Crear Categoría</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Diálogo Personalizado (Reemplazo estético de alert y confirm nativos) -->
  <div class="modal-overlay" id="customDialogModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-box custom-dialog-box">
      <div class="custom-dialog-header">
        <div class="custom-dialog-title-row">
          <span class="custom-dialog-icon" id="dialogIcon">🔔</span>
          <h3 id="dialogTitle" class="custom-dialog-title">Aviso</h3>
        </div>
        <button class="btn-action" id="dialogCloseBtn" title="Cerrar">✕</button>
      </div>
      <div class="custom-dialog-body">
        <p id="dialogMessage" class="custom-dialog-message"></p>
      </div>
      <div class="modal-footer custom-dialog-footer" id="dialogFooter">
        <button type="button" class="btn-secondary" id="dialogCancelBtn">Cancelar</button>
        <button type="button" class="btn" id="dialogConfirmBtn">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- Contenedor Flotante de Tooltips Modernos (Reemplazo del tooltip nativo del OS) -->
  <div id="appTooltip" role="tooltip" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
