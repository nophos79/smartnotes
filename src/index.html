<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartNotes - Spec-Driven Development</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="logo-icon">✓</div>
        <div>
          <h1>SmartNotes</h1>
          <div class="subtitle">Metodología Spec-Driven Development (SDD)</div>
        </div>
      </div>

      <!-- Acciones de Cabecera (Botón Nueva Nota, Tema, Categorías, Backup) -->
      <div class="header-actions">
        <button id="toggleFormBtn" class="btn-primary-action">➕ Nueva Nota</button>
        <button id="themeToggleBtn" class="btn-icon" title="Cambiar Tema">🌙 Modo Oscuro</button>
        <button id="openCategoryModalBtn" class="btn-icon" title="Nueva Categoría">🏷️ + Categoría</button>
        <button id="exportJsonBtn" class="btn-icon" title="Exportar Backup">💾 Exportar</button>
        <button id="importJsonBtn" class="btn-icon" title="Importar Backup">📥 Importar</button>
        <input type="file" id="importFileInput" accept=".json" style="display: none;">
      </div>
    </header>

    <!-- Estadísticas Clicables (Filtros por Estado) -->
    <section class="stats-grid">
      <div class="stat-card active" data-status-filter="all" title="Ver todas las notas">
        <span class="stat-label">Total Notas <span class="stat-hint">(Ver todas)</span></span>
        <span class="stat-value" id="totalNotes">0</span>
      </div>
      <div class="stat-card" data-status-filter="pending" title="Filtrar por notas pendientes">
        <span class="stat-label">Pendientes <span class="stat-hint">(Filtrar)</span></span>
        <span class="stat-value" id="pendingNotes">0</span>
      </div>
      <div class="stat-card" data-status-filter="completed" title="Filtrar por notas completadas">
        <span class="stat-label">Completadas <span class="stat-hint">(Filtrar)</span></span>
        <span class="stat-value" id="completedNotes">0</span>
      </div>
      <div class="stat-card" data-status-filter="overdue" title="Filtrar por notas vencidas">
        <span class="stat-label">Vencidas <span class="stat-hint">(Filtrar)</span></span>
        <span class="stat-value" id="overdueNotes" style="color: #f87171;">0</span>
      </div>
    </section>

    <!-- Formulario Plegable para Añadir Nota -->
    <section class="collapsible-section" id="newNoteSection">
      <div class="card">
        <div class="form-header-bar">
          <h2 class="form-title">➕ Crear Nueva Nota o Tarea</h2>
          <button type="button" class="btn-action" id="closeFormBtn" title="Ocultar formulario">✕ Ocultar</button>
        </div>
        <form id="newNoteForm">
          <div class="input-row">
            <input 
              type="text" 
              id="noteTitle" 
              class="flex-1" 
              placeholder="¿Qué necesitas hacer o recordar? (Obligatorio)" 
              required 
              autocomplete="off"
            />
            <select id="noteCategory">
              <!-- Se puebla dinámicamente -->
            </select>
            <input 
              type="date" 
              id="noteDueDate" 
              title="Fecha límite (opcional)"
            />
          </div>
          <textarea 
            id="noteContent" 
            placeholder="Detalles adicionales, enlaces o descripción..."
          ></textarea>
          <div>
            <button type="submit" class="btn">Guardar Nota</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Barra de Filtros, Búsqueda y Ordenación -->
    <section class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Buscar notas por título o texto..." 
          autocomplete="off"
        />
      </div>

      <div class="sort-box">
        <label for="sortSelect">Ordenar por:</label>
        <select id="sortSelect">
          <option value="newest">Más recientes</option>
          <option value="oldest">Más antiguas</option>
          <option value="az">Alfabético (A-Z)</option>
          <option value="due_date">Fecha Límite</option>
          <option value="urgency">Urgencia</option>
        </select>
      </div>

      <div class="filter-pills" id="categoryPills">
        <!-- Pestañas de categorías dinámicas -->
      </div>
    </section>

    <!-- Grid de Tarjetas de Notas -->
    <main class="notes-grid" id="notesGrid">
      <!-- Se puebla dinámicamente -->
    </main>
  </div>

  <!-- Modal para Editar Nota -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>✏️ Editar Nota</h3>
        <button class="btn-action" id="closeEditModalBtn">✕</button>
      </div>
      <form id="editNoteForm">
        <input type="hidden" id="editNoteId">
        <div>
          <label>Título:</label>
          <input type="text" id="editNoteTitle" style="width: 100%;" required>
        </div>
        <div class="input-row">
          <div style="flex: 1;">
            <label>Categoría:</label>
            <select id="editNoteCategory" style="width: 100%;"></select>
          </div>
          <div style="flex: 1;">
            <label>Fecha Límite:</label>
            <input type="date" id="editNoteDueDate" style="width: 100%;">
          </div>
        </div>
        <div>
          <label>Contenido:</label>
          <textarea id="editNoteContent" style="width: 100%;"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelEditBtn">Cancelar</button>
          <button type="submit" class="btn">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal para Gestión y Eliminación de Categorías -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🏷️ Gestionar Categorías</h3>
        <button class="btn-action" id="closeCategoryModalBtn">✕</button>
      </div>

      <!-- Lista de Categorías Existentes con Borrado -->
      <div>
        <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; display: block;">
          Categorías existentes:
        </label>
        <div class="category-list-container" id="categoryListContainer">
          <!-- Se puebla dinámicamente con botones de eliminar -->
        </div>
      </div>

      <!-- Formulario para Añadir Nueva Categoría -->
      <form id="newCategoryForm">
        <h4 style="font-size: 0.95rem; font-weight: 600; margin-bottom: 0.4rem;">➕ Añadir Nueva Categoría</h4>
        <div>
          <label>Nombre:</label>
          <input type="text" id="newCategoryName" placeholder="Ej: Gimnasio, Finanzas, Estudio..." required style="width: 100%;">
        </div>
        <div>
          <label>Color distintivo:</label>
          <input type="color" id="newCategoryColor" value="#38bdf8" style="height: 38px; width: 100%; cursor: pointer;">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancelCategoryBtn">Cerrar</button>
          <button type="submit" class="btn">Crear Categoría</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
